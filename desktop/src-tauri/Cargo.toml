[package]
name = "confide-desktop"
version = "0.1.2"
description = "Confide — team collaboration with client-contact protection"
authors = ["Algotix AI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
