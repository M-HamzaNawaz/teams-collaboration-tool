<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confide — offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: ui-sans-serif, system-ui, sans-serif; background: #0d0d13; color: #ececf2; }
  @media (prefers-color-scheme: light) { body { background: #f7f7fb; color: #16161d; } }
  .card { text-align: center; padding: 2rem; }
  .mark { width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 16px;
          background: linear-gradient(135deg, #6d5cff, #00b3a4); display: flex;
          align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: 700; }
  p { color: #6e6e7a; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">C</div>
    <h1>You&rsquo;re offline</h1>
    <p>Confide needs a connection — your messages are on the server, not this device.<br>They&rsquo;ll be right where you left them.</p>
  </div>
</body>
</html>
