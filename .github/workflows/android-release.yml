# Android release: push a tag like `android-v0.1.2` and this builds the
# Confide shell as an APK and attaches it to a GitHub Release, alongside the
# desktop installers. Sideload it — there is no Play Store listing.
#
# Two things differ from desktop-release.yml, both forced rather than chosen:
#
#   * No auto-update. tauri-plugin-updater declares `android = "none"` and
#     Android forbids silent self-install, so a new shell means downloading
#     this APK and tapping it. That matters far less than it sounds: the
#     shell only wraps the deployed web app, so Vercel deploys still reach
#     installed apps instantly. The APK itself should change rarely.
#   * gen/android is NOT in the repo (desktop/.gitignore ignores src-tauri/gen),
#     so `android init` regenerates the Gradle project on every run.
#
# The version users see comes from desktop/src-tauri/tauri.conf.json, not
# from the tag — bump both together.
#
# Optional repo secrets. WITHOUT them this builds a debug-signed APK, which
# installs fine and is the fastest way to get something onto a phone. WITH
# them it builds and signs a proper release APK:
#   ANDROID_KEYSTORE_BASE64    base64 of your .jks  (base64 -w0 confide.jks)
#   ANDROID_KEYSTORE_PASSWORD  its store password
#   ANDROID_KEY_ALIAS          the key alias inside it
#   ANDROID_KEY_PASSWORD       that key's password
#
# Generate the keystore once and never lose it — an APK signed with a
# different key will not install over an existing one:
#   keytool -genkey -v -keystore confide.jks -keyalg RSA -keysize 2048 \
#           -validity 10000 -alias confide

name: Android Release

on:
  push:
    tags: ['android-v*']
  # Buildable by hand too, so the pipeline can be exercised without cutting
  # a release tag.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 45
    env:
      # `secrets` is not reliably available inside a step-level `if`, so the
      # presence check reads this instead.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # arm64 only. Every Android phone made since roughly 2017 is arm64, so
      # the other three ABIs were three extra files nobody installs and three
      # extra compiles per run. To bring them back, add
      # armv7-linux-androideabi / i686-linux-android / x86_64-linux-android
      # here and the matching --target values below.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Runners ship an NDK already; downloading a second one is ~4.5 GB and
      # several minutes for no gain. Only fetch if the image ever stops
      # providing it.
      - name: Locate the NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "No preinstalled NDK — fetching one."
            sdkmanager --install "ndk;27.2.12479018"
            NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          fi
          echo "Using NDK at $NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Install shell dependencies
        run: npm ci
        working-directory: desktop

      # frontendDist is a remote URL, so there is no web build to run first —
      # this only scaffolds the Gradle project around the Rust crate.
      - name: Generate the Android project
        run: npx tauri android init --ci --skip-targets-install
        working-directory: desktop

      # wry configures the Android WebView with javaScript, domStorage,
      # geolocation, database and media flags — and nothing else. It never
      # touches useWideViewPort, whose Android default is FALSE, and while
      # that is false the WebView IGNORES <meta name="viewport">. So the
      # app's own `width=device-width, initial-scale=1` never applies and the
      # page lays out at the wrong width. Chrome on the same phone honours
      # it, which is exactly why this only shows up in the APK.
      #
      # WryActivity exposes `open fun onWebViewCreate(webView: WebView)` for
      # this. MainActivity is regenerated by `android init` on every run and
      # gen/ is gitignored, so the override is written here rather than
      # committed.

      # `android init` scaffolds res/ from the CLI's own template, and the
      # template ships the Tauri logo. Nothing in the pipeline replaced it, so
      # every APK so far has installed under a stock Tauri icon while web and
      # desktop carried the Confide mark. `tauri icon` is not the answer here:
      # it writes src-tauri/icons/, which is exactly where the correct art
      # already sits — committed, reviewed, and simply never copied across.
      #
      # gen/ is gitignored and regenerated on every run, so this belongs in
      # the pipeline beside the other generated-file surgery, not in the repo.
      - name: Install the Confide launcher icons
        run: |
          python3 - <<'PYEOF'
          import pathlib, re, shutil

          src = pathlib.Path('desktop/src-tauri/icons/android')
          res = pathlib.Path('desktop/src-tauri/gen/android/app/src/main/res')
          if not src.is_dir():
              raise SystemExit(f'::error::{src} is missing — icons cannot be installed')
          if not res.is_dir():
              raise SystemExit(f'::error::{res} is missing — did android init change its layout?')

          copied = 0
          for d in sorted(src.glob('mipmap-*')):
              dest = res / d.name
              dest.mkdir(parents=True, exist_ok=True)
              for f in sorted(d.iterdir()):
                  shutil.copy2(f, dest / f.name)
                  copied += 1
          if copied == 0:
              raise SystemExit('::error::no mipmap files found to install')
          print(f'installed {copied} launcher files')

          # The adaptive background is a colour resource. Android fails the
          # build on a duplicate resource name, so any definition the template
          # already made is stripped before ours is written — otherwise this
          # step would work only for as long as the template happens not to
          # declare one.
          name = 'ic_launcher_background'
          for xml in sorted((res / 'values').glob('*.xml')):
              if xml.name == f'{name}.xml':
                  continue
              text = xml.read_text()
              stripped = re.sub(
                  rf'\s*<color name="{name}">[^<]*</color>', '', text
              )
              if stripped != text:
                  xml.write_text(stripped)
                  print(f'removed the template {name} from {xml.name}')

          (res / 'values').mkdir(parents=True, exist_ok=True)
          shutil.copy2(src / 'values' / f'{name}.xml', res / 'values' / f'{name}.xml')
          print((res / 'values' / f'{name}.xml').read_text().strip())
          PYEOF

      - name: Make the window shrink for the soft keyboard
        run: |
          python3 - <<'PYEOF'
          import json, pathlib
          pkg = json.load(open('desktop/src-tauri/tauri.conf.json'))['identifier']
          root = pathlib.Path('desktop/src-tauri/gen/android/app/src/main/java')
          d = root / pkg.replace('.', '/')
          if not d.is_dir():
              raise SystemExit(f'::error::expected {d} — did android init change its layout?')
          # Built line by line on purpose: a triple-quoted block inside a YAML
          # block scalar inside a heredoc picks up indentation from all three.
          kotlin = '\n'.join([
              f'package {pkg}',
              '',
              'import android.content.pm.ApplicationInfo',
              'import android.os.Bundle',
              'import android.view.View',
              'import android.webkit.WebView',
              'import androidx.core.view.ViewCompat',
              'import androidx.core.view.WindowInsetsCompat',
              '',
              '// TauriActivity is generated into this same package, so it needs no import.',
              'class MainActivity : TauriActivity() {',
              '    // WryActivity defaults this to true; TauriActivity overrides it to',
              '    // false, which stops the Android back gesture — a left-edge swipe on',
              '    // any modern phone — from ever reaching the page. Pressing back left',
              '    // the app instead of leaving the conversation. True routes it to',
              '    // webView.goBack(), and the web side pushes a history entry when a',
              '    // conversation opens, so the swipe lands on the conversation list.',
              '    // With nothing left to go back to, canGoBack() is false and Android',
              '    // closes the app, which is what a back press should do there.',
              '    override val handleBackNavigation: Boolean = true',
              '',
              '    // The composer sat underneath the soft keyboard. targetSdk is 36,',
              '    // and from SDK 35 edge-to-edge is mandatory: the window no longer',
              '    // resizes for the IME, so adjustResize alone does nothing and the app',
              '    // simply draws behind the keyboard. The page cannot help itself here —',
              '    // interactive-widget=resizes-content only matters once the webview is',
              '    // told the visible area shrank, and nothing was telling it.',
              '    //',
              '    // Bottom padding equal to the IME inset, and ONLY the IME inset: the',
              '    // system-bar insets stay unpadded so the app keeps drawing edge to',
              '    // edge, which is what viewport-fit=cover and the CSS safe-area',
              '    // padding already assume. Keyboard closed, the inset is 0 and nothing',
              '    // changes.',
              '    override fun onCreate(savedInstanceState: Bundle?) {',
              '        super.onCreate(savedInstanceState)',
              '        val content = findViewById<View>(android.R.id.content)',
              '        ViewCompat.setOnApplyWindowInsetsListener(content) { view, insets ->',
              '            val ime = insets.getInsets(WindowInsetsCompat.Type.ime()).bottom',
              '            view.setPadding(0, 0, 0, ime)',
              '            insets',
              '        }',
              '    }',
              '',
              '    override fun onWebViewCreate(webView: WebView) {',
              '        // Without these two, Android ignores <meta name="viewport">',
              '        // and the page lays out at the wrong width.',
              '        webView.settings.useWideViewPort = true',
              '        webView.settings.loadWithOverviewMode = true',
              '',
              '        // Debug builds only: lets chrome://inspect attach from a',
              '        // desktop, so window.innerWidth can be read off the device.',
              '        if ((applicationInfo.flags and ApplicationInfo.FLAG_DEBUGGABLE) != 0) {',
              '            WebView.setWebContentsDebuggingEnabled(true)',
              '        }',
              '    }',
              '}',
              '',
          ])
          (d / 'MainActivity.kt').write_text(kotlin)
          print(kotlin)

          # Below SDK 35 the window still resizes for the IME, and this is what
          # asks it to. Harmless above, where the inset listener does the work.
          manifest = pathlib.Path(
              'desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml'
          )
          xml = manifest.read_text()
          if 'windowSoftInputMode' not in xml:
              patched = xml.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity"\n            android:windowSoftInputMode="adjustResize"',
                  1,
              )
              if patched == xml:
                  raise SystemExit(
                      '::error::MainActivity not found in AndroidManifest.xml'
                  )
              manifest.write_text(patched)
              print('AndroidManifest: windowSoftInputMode=adjustResize')
          PYEOF

      - name: Unpack the signing keystore
        id: keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/confide.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: desktop
        env:
          # Debug builds keep full symbols, which is where ~100 MB of the
          # 115 MB APK came from — the four ABIs were never the problem.
          # Nobody debugs the Rust shell (the webview is inspected from
          # chrome://inspect), so strip them. Set as an env override rather
          # than a [profile.dev] block so local `tauri dev` keeps its
          # symbols; this affects CI only.
          CARGO_PROFILE_DEV_STRIP: debuginfo
        run: |
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            # Release build. Gradle leaves it unsigned; apksigner below signs
            # it — patching the generated build.gradle.kts would mean redoing
            # that surgery every time `android init` regenerates the file.
            npx tauri android build --apk --split-per-abi --target aarch64
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building a DEBUG-signed APK. Installable, but not for real distribution."
            npx tauri android build --apk --split-per-abi --target aarch64 --debug
          fi

      - name: Sign and align
        if: steps.keystore.outputs.present == 'true'
        # Passed as env, not interpolated into the command line: a password
        # with shell metacharacters would otherwise break the script, and
        # argv is visible to anything that can read /proc.
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          OUT=desktop/src-tauri/gen/android/app/build/outputs/apk
          for apk in $(find "$OUT" -name '*-unsigned.apk'); do
            aligned="${apk%-unsigned.apk}-aligned.apk"
            signed="${apk%-unsigned.apk}.apk"
            "$BUILD_TOOLS/zipalign" -p -f 4 "$apk" "$aligned"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/confide.jks" \
              --ks-pass "pass:$KS_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$signed" "$aligned"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$signed"
            rm -f "$aligned"
          done

      - name: Collect the APKs
        id: collect
        run: |
          mkdir -p dist
          # -unsigned copies are intermediates; never publish one.
          find desktop/src-tauri/gen/android/app/build/outputs/apk \
            -name '*.apk' ! -name '*-unsigned.apk' -exec cp {} dist/ \;
          ls -la dist
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: confide-android-apk
          path: dist/*.apk

      # Tag runs publish; a manual run just leaves the artifact above, so the
      # pipeline can be tested without creating a release.
      - name: Publish to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "Confide Android $GITHUB_REF_NAME" \
              --notes "Download the APK below and tap it. Android will ask you to allow \"Install unknown apps\" for your browser or file manager the first time. Built for arm64, which is every Android phone made since roughly 2017. The app updates its content automatically on every web deploy; you only need a new APK when the shell itself changes."
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
