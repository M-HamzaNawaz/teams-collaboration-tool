# CI (M0-05) — a PR with a lint error, type error, or failing test cannot merge.
#
# Two jobs:
#   checks — lint, typecheck, unit tests. No Docker, fast feedback.
#   db     — boots the Supabase stack and runs grant/RLS/invariant tests.
#            These assert properties enforced by Postgres itself (M1-12, M1-13),
#            so they cannot run without a real database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every main push finish — otherwise
  # rapid pushes paint older commits with misleading red X's.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Includes the detection corpus gate (M2-10): ≥95% recall on hold cases,
      # <5% false-hold rate — the spec's §11 metric enforced per commit.
      - run: npm run test:unit

  db:
    name: Database invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - run: npm ci

      - name: Start Supabase stack (applies all migrations)
        run: supabase start

      # Exports API_URL / SERVICE_ROLE_KEY etc. for the authorize() suite.
      - name: Export Supabase env
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"

      - name: Run db tests (isolation + invariants + authorize matrix)
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - run: npm ci

      - name: Start Supabase stack (applies all migrations)
        run: supabase start

      - name: Export Supabase env
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"

      - name: Seed
        run: npx tsx scripts/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Ensure Chrome for Playwright
        run: command -v google-chrome || npx playwright install --with-deps chrome

      - name: Start dev server
        run: |
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres \
          NEXT_PUBLIC_APP_URL=http://localhost:3000 \
          npm run dev &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login -o /dev/null && break; sleep 2; done

      - name: Warm route compilation
        run: |
          for path in /login /signup /reset /manifest.webmanifest; do
            curl -sf "http://localhost:3000$path" -o /dev/null || true
          done

      # The journey that IS the product: invite -> consent -> hold ->
      # recipient blind -> approve -> deliver -> audit chain. Gates release.
      - name: Run E2E suite
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
