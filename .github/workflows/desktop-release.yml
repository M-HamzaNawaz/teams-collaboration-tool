# Desktop release: push a tag like `desktop-v0.1.1` and this builds the
# Confide shell for Windows, macOS, and Linux, signs the update artifacts,
# and publishes everything (installers + latest.json) as a release on
# this repo (public), using the built-in GITHUB_TOKEN — no PAT needed.
# Installed apps poll that release feed 15s after launch and offer the
# update. Web-content changes never need this; Vercel handles those.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           updater signing key (~/.tauri/confide-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password

name: Desktop Release

on:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    # A hung apt mirror once sat for 2h+ — kill anything unreasonable.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install shell dependencies
        run: npm ci
        working-directory: desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Confide Desktop ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your system below. Installed apps offer this update automatically.'
          args: ${{ matrix.args }}

  android:
    # Real Android APK from the same Tauri shell. Signed with the PKCS12
    # keystore in the repo secrets (ANDROID_KEYSTORE_B64 + _PASSWORD) via
    # zipalign+apksigner — no gradle signing config to patch. No auto-update
    # on Android: users install the new APK from /download.
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install shell dependencies
        run: npm ci
        working-directory: desktop

      - name: Scaffold Android project
        run: npx tauri android init
        working-directory: desktop

      - name: Generate icons into the Android project
        run: npx tauri icon app-icon.png
        working-directory: desktop

      - name: Build APK (arm64)
        run: npx tauri android build --apk --target aarch64
        working-directory: desktop

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          echo "$KS_B64" | base64 -d > /tmp/confide.p12
          UNSIGNED=$(find desktop/src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)
          echo "unsigned: $UNSIGNED"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          "$BT/zipalign" -p 4 "$UNSIGNED" /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/confide.p12 --ks-type PKCS12 \
            --ks-key-alias confide --ks-pass "pass:$KS_PASS" \
            --out "Confide_${VERSION}_android.apk" /tmp/aligned.apk
          "$BT/apksigner" verify "Confide_${VERSION}_android.apk"

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" Confide_*_android.apk --clobber
