# Desktop release: push a tag like `desktop-v0.1.1` and this builds the
# Confide shell for Windows, macOS, and Linux, signs the update artifacts,
# and publishes everything (installers + latest.json) as a release on
# this repo (public), using the built-in GITHUB_TOKEN — no PAT needed.
# Installed apps poll that release feed 15s after launch and offer the
# update. Web-content changes never need this; Vercel handles those.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           updater signing key (~/.tauri/confide-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password

name: Desktop Release

on:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    # A hung apt mirror once sat for 2h+ — kill anything unreasonable.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install shell dependencies
        run: npm ci
        working-directory: desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Confide Desktop ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your system below. Installed apps offer this update automatically.'
          args: ${{ matrix.args }}

